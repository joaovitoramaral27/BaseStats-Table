<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Stats</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #ffff;
            font-family: Arial, sans-serif;
            color: black;
            flex-direction: column;
            padding: 20px;
        }

        .stats-box {
            width: 650px;
            max-width: 100%;
            padding: 30px;
            background: #f0f0f0;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .stat-row {
            display: grid;
            grid-template-columns: 55px 1fr 80px;
            align-items: center;
            gap: 15px;
            margin: 12px 0;
        }

        .stat-input {
            width: 55px;
            height: 32px;
            border: none;
            border-radius: 6px;
            text-align: center;
            font-size: 15px;
            font-weight: bold;
            background: #ffffff;
            color: black;
            outline: none;
        }

        .stat-input:focus {
            box-shadow: 0 0 0 2px #fff;
        }

        .bar-container {
            height: 22px;
            background: #d3d3d3;
            border-radius: 20px;
            overflow: hidden;
        }

        .bar {
            height: 100%;
            width: 0%;
            border-radius: 20px;

            background: rgb(255, 0, 0);

            transition:
                width 0.25s ease,
                background-color 0.25s ease;
        }

        .stat-name {
            font-weight: bold;
            font-size: 15px;
        }

        .total {
            display: grid;
            grid-template-columns: 55px 1fr 80px;
            align-items: center;
            gap: 15px;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #444;
        }

        .total-label {
            grid-column: 3;
            font-size: 18px;
            font-weight: bold;
        }

        .total-value {
            grid-column: 1;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }

        button {
            margin-top: 50px;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            color: black;
            background-color: #d3d3d3;
            border: black 1px solid;
            border-radius: 5px;
            cursor: pointer;
        }


        /* =========================
           RESPONSIVIDADE
           ========================= */

        @media (max-width: 600px) {

            body {
                padding: 15px;
                justify-content: center;
            }

            .stats-box {
                width: 100%;
                padding: 20px 15px;
                border-radius: 12px;
            }

            .stat-row {
                grid-template-columns: 50px minmax(0, 1fr) 65px;
                gap: 10px;
                margin: 10px 0;
            }

            .stat-input {
                width: 50px;
                height: 32px;
                font-size: 14px;
            }

            .bar-container {
                height: 20px;
            }

            .stat-name {
                font-size: 14px;
            }

            .total {
                grid-template-columns: 50px minmax(0, 1fr) 65px;
                gap: 10px;
                margin-top: 20px;
                padding-top: 15px;
            }

            .total-label {
                font-size: 16px;
            }

            .total-value {
                font-size: 18px;
            }

            button {
                width: 100%;
                max-width: 300px;
                margin-top: 30px;
                padding: 12px 15px;
                font-size: 15px;
            }
        }


        /* Celulares bem pequenos */

        @media (max-width: 380px) {

            body {
                padding: 10px;
            }

            .stats-box {
                padding: 15px 10px;
            }

            .stat-row {
                grid-template-columns: 45px minmax(0, 1fr) 58px;
                gap: 7px;
            }

            .stat-input {
                width: 45px;
                font-size: 13px;
            }

            .stat-name {
                font-size: 13px;
            }

            .bar-container {
                height: 18px;
            }

            .total {
                grid-template-columns: 45px minmax(0, 1fr) 58px;
                gap: 7px;
            }

            .total-label {
                font-size: 15px;
            }

            .total-value {
                font-size: 17px;
            }
        }

    </style>

    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>

<body>

    <div class="stats-box" id="stats-box">

        <div class="stat-row">
            <input class="stat-input" type="number" min="0" max="255" value="0">
            <div class="bar-container">
                <div class="bar"></div>
            </div>
            <div class="stat-name">HP</div>
        </div>

        <div class="stat-row">
            <input class="stat-input" type="number" min="0" max="255" value="0">
            <div class="bar-container">
                <div class="bar"></div>
            </div>
            <div class="stat-name">Attack</div>
        </div>

        <div class="stat-row">
            <input class="stat-input" type="number" min="0" max="255" value="0">
            <div class="bar-container">
                <div class="bar"></div>
            </div>
            <div class="stat-name">Defense</div>
        </div>

        <div class="stat-row">
            <input class="stat-input" type="number" min="0" max="255" value="0">
            <div class="bar-container">
                <div class="bar"></div>
            </div>
            <div class="stat-name">Sp.Atk</div>
        </div>

        <div class="stat-row">
            <input class="stat-input" type="number" min="0" max="255" value="0">
            <div class="bar-container">
                <div class="bar"></div>
            </div>
            <div class="stat-name">Sp.Def</div>
        </div>

        <div class="stat-row">
            <input class="stat-input" type="number" min="0" max="255" value="0">
            <div class="bar-container">
                <div class="bar"></div>
            </div>
            <div class="stat-name">Speed</div>
        </div>

        <div class="total">
            <div class="total-value" id="total">0</div>
            <div class="total-label">Total</div>
        </div>

    </div>

    <button onclick="downloadStats()">Download Stats Table</button>


    <script>

        const inputs = document.querySelectorAll(".stat-input");
        const bars = document.querySelectorAll(".bar");
        const totalElement = document.getElementById("total");


        function interpolateColor(color1, color2, factor) {

            const r = Math.round(
                color1[0] + (color2[0] - color1[0]) * factor
            );

            const g = Math.round(
                color1[1] + (color2[1] - color1[1]) * factor
            );

            const b = Math.round(
                color1[2] + (color2[2] - color1[2]) * factor
            );

            return `rgb(${r}, ${g}, ${b})`;
        }


        function getStatColor(value) {

            const vermelho = [255, 0, 0];
            const laranja = [255, 128, 0];
            const amarelo = [255, 220, 0];
            const verdeClaro = [173, 255, 47];
            const verdeEscuro = [0, 128, 0];
            const ciano = [0, 255, 255];


            function lateTransition(value, start, end, transitionSize) {

                const transitionStart = end - transitionSize;

                if (value < transitionStart) {
                    return 0;
                }

                let factor =
                    (value - transitionStart) /
                    (end - transitionStart);

                factor = Math.max(0, Math.min(1, factor));

                factor = factor * factor * (3 - 2 * factor);

                return factor;
            }


            if (value < 50) {

                const factor = lateTransition(
                    value,
                    0,
                    49,
                    10
                );

                return interpolateColor(
                    vermelho,
                    laranja,
                    factor
                );
            }


            if (value < 80) {

                const factor = lateTransition(
                    value,
                    50,
                    79,
                    7
                );

                return interpolateColor(
                    laranja,
                    amarelo,
                    factor
                );
            }


            if (value < 100) {

                const factor = lateTransition(
                    value,
                    80,
                    99,
                    5
                );

                return interpolateColor(
                    amarelo,
                    verdeClaro,
                    factor
                );
            }


            if (value < 130) {

                const factor = lateTransition(
                    value,
                    100,
                    129,
                    7
                );

                return interpolateColor(
                    verdeClaro,
                    verdeEscuro,
                    factor
                );
            }


            if (value < 170) {

                const factor = lateTransition(
                    value,
                    130,
                    169,
                    10
                );

                return interpolateColor(
                    verdeEscuro,
                    ciano,
                    factor
                );
            }


            return `rgb(
                ${ciano[0]},
                ${ciano[1]},
                ${ciano[2]}
            )`;
        }


        function updateStats() {

            let total = 0;

            inputs.forEach((input, index) => {

                let value = Number(input.value);

                if (value < 0) {
                    value = 0;
                    input.value = 0;
                }

                if (value > 255) {
                    value = 255;
                    input.value = 255;
                }

                total += value;

                const percentage = (value / 255) * 100;

                bars[index].style.width =
                    percentage + "%";

                bars[index].style.backgroundColor =
                    getStatColor(value);
            });

            totalElement.textContent = total;
        }


        inputs.forEach(input => {
            input.addEventListener(
                "input",
                updateStats
            );
        });


        updateStats();


        async function downloadStats() {

            const element =
                document.getElementById("stats-box");

            const canvas = await html2canvas(element, {
                scale: 2,
                backgroundColor: "#f0f0f0"
            });

            const link =
                document.createElement("a");

            link.download = "Stats-Table.png";

            link.href =
                canvas.toDataURL("image/png");

            link.click();
        }

    </script>

</body>
</html>
