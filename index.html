<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Stats</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>

<body>

    <div class="stats-box" id="stats-box">

        <div class="stat-row">
            <input class="stat-input" type="number" min="0" max="255" value="0">
            <div class="bar-container">
                <div class="bar"></div>
            </div>
            <div class="stat-name">HP</div>
        </div>

        <div class="stat-row">
            <input class="stat-input" type="number" min="0" max="255" value="0">
            <div class="bar-container">
                <div class="bar"></div>
            </div>
            <div class="stat-name">Attack</div>
        </div>

        <div class="stat-row">
            <input class="stat-input" type="number" min="0" max="255" value="0">
            <div class="bar-container">
                <div class="bar"></div>
            </div>
            <div class="stat-name">Defense</div>
        </div>

        <div class="stat-row">
            <input class="stat-input" type="number" min="0" max="255" value="0">
            <div class="bar-container">
                <div class="bar"></div>
            </div>
            <div class="stat-name">Sp.Atk</div>
        </div>

        <div class="stat-row">
            <input class="stat-input" type="number" min="0" max="255" value="0">
            <div class="bar-container">
                <div class="bar"></div>
            </div>
            <div class="stat-name">Sp.Def</div>
        </div>

        <div class="stat-row">
            <input class="stat-input" type="number" min="0" max="255" value="0">
            <div class="bar-container">
                <div class="bar"></div>
            </div>
            <div class="stat-name">Speed</div>
        </div>

        <div class="total">
            <div class="total-value" id="total">0</div>
            <div class="total-label">Total</div>
        </div>

    </div>

    <button onclick="downloadStats()">Download Stats Table</button>

    <script src="script.js"></script>
</body>
</html>
